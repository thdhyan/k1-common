[project]
name = "k1-common"
version = "0.1.0"
description = "Robot contract: joints, gains, obs/action layout, wiring, motion-clip schema."
requires-python = ">=3.10"
dependencies = [
  "mujoco",
  "numpy",
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k1_common"]

# Provided by the environment (ROS 2, Isaac Sim/Lab, mjlab, robot SDK) or not on PyPI under this name:
# mjlab, pxr
