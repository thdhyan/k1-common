[project]
name = "k1-common"
version = "0.1.0"
description = "Robot contract: joints, gains, obs/action layout, wiring, motion-clip schema."
requires-python = ">=3.10"
dependencies = [
  "k1-description",
  "numpy",
]

[project.optional-dependencies]
mujoco = ["mujoco"]  # clip_schema.verify_joint_order
test = ["pytest", "mujoco"]

[tool.uv.sources]
k1-description = { git = "https://github.com/thdhyan/k1-description" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k1_common"]

# Provided by the environment: pxr (USD tests only)
